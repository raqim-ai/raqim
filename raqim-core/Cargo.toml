[package]
name = "raqim-core"
version = "0.1.2"
edition = "2021"

[features]
default = []
vector-memory = ["dep:fastembed", "dep:lancedb", "dep:arrow-array", "dep:arrow-schema"]
mock-embedding = []

[dependencies]
fastembed = { version = "5.12", optional = true }
lancedb = { version = "0.9", optional = true }
arrow-array = { version = "52.2", optional = true }
arrow-schema = { version = "52.2", optional = true }

# Core Execution-Integrity & Storage Engine
rkyv = { version = "0.8.15", features = ["bytecheck"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
blake3 = "1.5"
hex = "0.4"
uuid = { version = "1.10", features = ["v7", "serde"] }
anyhow = "1.0"
base64 = "0.23.0"
crc32fast = "1.4"
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
memmap2 = "0.9"
rand = "0.10.0"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.2", features = ["json", "stream"] }
notify = "8.2.0"
serde_json = "1.0.149"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core", "serde"] }
parking_lot = "0.12"
dashmap = "6.1.0"
axum = { version = "0.8", features = [ "macros"] }
async-trait = "0.1.89"
tokio-util = "0.7.18"
postcard = {version = "1.1.3", features = ["alloc"] }
tower-http = { version = "0.5", features = ["cors", "catch-panic"] }

[build-dependencies]
cc = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }