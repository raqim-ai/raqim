name: Global Release & Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # =========================================================================
  # JOB 1: Cross-Platform Native Binaries (raqim-core, raqim-cli, raqim-mcp)
  # =========================================================================
  build-binaries:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: raqim-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: raqim-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: raqim-windows-x86_64

    steps:

      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Configure 10GB Swap Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Strawberry Perl (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ -d "/c/Strawberry/perl/bin" ]; then
            echo "/c/Strawberry/perl/bin" >> $GITHUB_PATH
          elif [ -d "C:/Strawberry/perl/bin" ]; then
            echo "C:/Strawberry/perl/bin" >> $GITHUB_PATH
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protobuf Compiler (Cross-Platform)
        uses: arduino/setup-protoc@v3 
        with: 
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler build-essential

      - name: Fetch Dependencies and Patch Recursion Limits
        shell: bash
        run: |
          cargo fetch --target ${{ matrix.target }}
          python3 -c "
          import glob, os
          pattern = os.path.expanduser('~/.cargo/registry/src/**/lance-*/src/lib.rs')
          for path in glob.glob(pattern, recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              if 'recursion_limit' not in code:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('#![recursion_limit = \"512\"]\n' + code)
                  print(f'Patched recursion limit in {path}')
          " 2>/dev/null || python -c "
          import glob, os
          pattern = os.path.expanduser('~/.cargo/registry/src/**/lance-*/src/lib.rs')
          for path in glob.glob(pattern, recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              if 'recursion_limit' not in code:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('#![recursion_limit = \"512\"]\n' + code)
                  print(f'Patched recursion limit in {path}')
          " 2>/dev/null || true

      - name: Compile Release Binaries
        shell: bash
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          cargo build --release --target ${{ matrix.target }} --bin raqim-core
          cargo build --release --target ${{ matrix.target }} --bin raqim-cli
          cargo build --release --target ${{ matrix.target }} --bin raqim-mcp

      - name: Package Binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/raqim-core dist/
          cp target/${{ matrix.target }}/release/raqim-cli dist/
          cp target/${{ matrix.target }}/release/raqim-mcp dist/
          cd dist && tar -czvf ../${{ matrix.artifact_name }}.tar.gz *

      - name: Package Binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $targetPath = if (Test-Path "target/${{ matrix.target }}/release/raqim-core.exe") { "target/${{ matrix.target }}/release" } else { "target/release" }
          Copy-Item "$targetPath/raqim-core.exe" dist/
          Copy-Item "$targetPath/raqim-cli.exe" dist/
          Copy-Item "$targetPath/raqim-mcp.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip -Force

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 2: Multi-Stage Container Build & Push to GHCR
  # =========================================================================
  publish-container:
    name: Build & Push OCI Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Configure 10GB Swap Space (Ubuntu)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/core
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Daemon Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 3: Compile PyO3 C-Extensions & Publish Python Wheel to PyPI
  # =========================================================================
  publish-pypi:
    name: Build & Publish raqim-py (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - name: Configure 10GB Swap Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf Compiler (Cross-Platform)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler build-essential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Dependencies and Patch Recursion Limits
        shell: bash
        run: |
          cargo fetch --manifest-path raqim-py/Cargo.toml
          python3 -c "
          import glob, os
          pattern = os.path.expanduser('~/.cargo/registry/src/**/lance-*/src/lib.rs')
          for path in glob.glob(pattern, recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              if 'recursion_limit' not in code:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('#![recursion_limit = \"512\"]\n' + code)
                  print(f'Patched recursion limit in {path}')
          " 2>/dev/null || python -c "
          import glob, os
          pattern = os.path.expanduser('~/.cargo/registry/src/**/lance-*/src/lib.rs')
          for path in glob.glob(pattern, recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  code = f.read()
              if 'recursion_limit' not in code:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('#![recursion_limit = \"512\"]\n' + code)
                  print(f'Patched recursion limit in {path}')
          " 2>/dev/null || true

      - name: Build Wheels with Maturin
        uses: PyO3/maturin-action@v1
        env:
          CARGO_BUILD_JOBS: 1
        with:
          args: --release --out dist --manifest-path raqim-py/Cargo.toml
          sccache: 'true'
          manylinux: off

      - name: Repair Linux Wheel with Auditwheel
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pip install auditwheel
          auditwheel repair dist/*linux_x86_64.whl -w dist/
          rm -f dist/*linux_x86_64.whl

      - name: Upload Wheels to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  release-pypi:
    name: Publish Wheels to PyPI
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true