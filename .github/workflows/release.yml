name: Global Release & Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Cross-Platform Native Binaries (raqim-core, raqim-cli)
  # =========================================================================
  build-binaries:
    name: Build Native Binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: raqim-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: raqim-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: raqim-windows-x86_64

    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential

      - name: Compile Release Binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --bin raqim-core
          cargo build --release --target ${{ matrix.target }} --bin raqim-cli

      - name: Package Binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/raqim-core dist/
          cp target/${{ matrix.target }}/release/raqim-cli dist/
          strip dist/raqim-core dist/raqim-cli || true
          tar -C dist -czvf ${{ matrix.artifact_name }}.tar.gz raqim-core raqim-cli
          ls -lh ${{ matrix.artifact_name }}.tar.gz

      - name: Package Binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/raqim-core.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/raqim-cli.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip -Force
          Get-Item ${{ matrix.artifact_name }}.zip

      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.artifact_name }}.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # JOB 2: Multi-Stage Container Build & Push to GHCR
  # =========================================================================
  publish-container:
    name: Build & Push OCI Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/core
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Daemon Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # JOB 3: Compile abi3 PyO3 Wheels & Publish to PyPI
  # =========================================================================
  publish-pypi:
    name: Build raqim-py Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Free Disk Space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Linux manylinux abi3 Wheel & sdist
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path raqim-py/Cargo.toml --sdist
          manylinux: '2014'

      - name: Build macOS / Windows abi3 Wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path raqim-py/Cargo.toml

      - name: Upload Wheels to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*

  release-pypi:
    name: Publish Package to PyPI
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true
