[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "raqim"
version = "0.2.0"
description = "Zero-Secret AI Egress Gateway, Pre-Execution Policy Gate & Cryptographic Flight Recorder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.2.0"
]

[tool.maturin]
module-name = "raqim.raqim_core"
python-source = "."