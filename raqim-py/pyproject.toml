[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "raqim"
version = "0.1.0"
description = "Sovereign Flight Recorder & Deterministic Replay Engine for AI Agent Swarms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[tool.maturin]
module-name = "raqim.raqim_core"
python-source = "."