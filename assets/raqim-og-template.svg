<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="glow-left" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#080C14" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#glow-left)" />
  <rect width="1280" height="640" fill="url(#glow-right)" />

  <!-- Top Release Badge -->
  <g transform="translate(80, 75)">
    <rect width="320" height="34" rx="17" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10B981" />
    <text x="32" y="22" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="600" letter-spacing="1">
      RUST EGRESS GATEWAY • v0.2.0
    </text>
  </g>

  <!-- Title & Arabic Calligraphic Moniker -->
  <g transform="translate(80, 185)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="74" font-weight="800" letter-spacing="-1.5">
      Raqim
    </text>
    <text x="245" y="-5" fill="#34D399" font-family="'Amiri', 'Noto Naskh Arabic', serif" font-size="58" font-weight="400">
      رَقِيم
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="80" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" letter-spacing="-0.2">
    Zero-Secret AI Payment &amp; API Airlock, Policy Gate &amp; Tamper-Evident Flight Recorder
  </text>

  <!-- 4 Performance & Security Cards -->
  <g transform="translate(80, 310)">
    <!-- Metric 1: Zero-Secret Airlock -->
    <g transform="translate(0, 0)">
      <rect width="255" height="150" rx="14" fill="url(#card-grad)" stroke="url(#card-border)" stroke-width="1.2" />
      <text x="24" y="52" fill="#34D399" font-family="monospace" font-size="34" font-weight="800">0 Keys</text>
      <text x="155" y="44" fill="#6EE7B7" font-family="monospace" font-size="13" font-weight="600">IN AGENT</text>
      <text x="24" y="86" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Zero-Secret Airlock</text>
      <text x="24" y="112" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">rqm_v1 Ed25519 workload tokens</text>
    </g>

    <!-- Metric 2: Durable fdatasync TPS -->
    <g transform="translate(285, 0)">
      <rect width="255" height="150" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="24" y="52" fill="#38BDF8" font-family="monospace" font-size="34" font-weight="800">7,175</text>
      <text x="135" y="44" fill="#7DD3FC" font-family="monospace" font-size="14" font-weight="600">TPS</text>
      <text x="24" y="86" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">True fdatasync ACK</text>
      <text x="24" y="112" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Synchronous durable WAL commit</text>
    </g>

    <!-- Metric 3: SSE Byte-Tee Replay -->
    <g transform="translate(570, 0)">
      <rect width="255" height="150" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="24" y="52" fill="#A78BFA" font-family="monospace" font-size="34" font-weight="800">$0.00</text>
      <text x="132" y="44" fill="#C4B5FD" font-family="monospace" font-size="13" font-weight="600">~3ms HIT</text>
      <text x="24" y="86" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">SSE Stream Replay</text>
      <text x="24" y="112" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Inline byte-tee &amp; shadow forking</text>
    </g>

    <!-- Metric 4: NDPA & Merkle Proofs -->
    <g transform="translate(855, 0)">
      <rect width="255" height="150" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
      <text x="24" y="52" fill="#F43F5E" font-family="monospace" font-size="30" font-weight="800">NDPA 23</text>
      <text x="24" y="86" fill="#F1F5F9" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Crypto-Shredding</text>
      <text x="24" y="112" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Erase PII; BLAKE3 proofs stay valid</text>
    </g>
  </g>

  <!-- Footer Info Bar -->
  <g transform="translate(80, 565)">
    <text x="0" y="0" fill="#10B981" font-family="monospace" font-size="15" font-weight="700">&gt;</text>
    <text x="20" y="0" fill="#CBD5E1" font-family="monospace" font-size="14" font-weight="500">./run_demo.sh</text>
    <text x="160" y="0" fill="#475569" font-family="monospace" font-size="14">|</text>
    <text x="180" y="0" fill="#CBD5E1" font-family="monospace" font-size="14" font-weight="500">docker compose up --build</text>

    <text x="1120" y="0" text-anchor="end" fill="#64748B" font-family="monospace" font-size="14" font-weight="500">
      github.com/raqim-ai/raqim
    </text>
  </g>
</svg>
