# Raqim Aegis Cryptographic Firewall & Governance Policy Manifest

[groups.admin_group]
allowed_namespaces = ["*"]
blocked_namespaces = []
max_tps = 1_000_000
burst_capacity = 500_000

[groups.finance_worker]
allowed_namespaces = ["/rqm_finance/*", "/audit/*"]
blocked_namespaces = ["/admin/*", "/system/*"]
max_tps = 1000
burst_capacity = 100

[groups.untrusted_agent]
allowed_namespaces = ["/sandbox/temp/*", /system/*]
blocked_namespaces = ["*"]
max_tps = 10
burst_capacity = 5

[groups.analyst_group]
allowed_namespaces = ["/system/*", "/finance/tools/*", "/finance/reasoning/*"]
blocked_namespaces = ["/finance/restricted/*", "/admin/*"]
max_tps = 100
burst_capacity = 200