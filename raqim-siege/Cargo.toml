[package]
name = "raqim-siege"
version = "0.2.0"
edition = "2021"

[dependencies]

raqim-core = { path = "../raqim-core", default-features = false }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
hex = "0.4"
rkyv = { version = "0.8.15", features = ["bytecheck"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
postcard = "1.1.3"
blake3 = "1.5"