services:
  raqim-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raqim-gateway
    environment:
      - RAQIM_ENV=production
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-sk_live_SOVEREIGN_VAULT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk_proj_SOVEREIGN_OPENAI_SECRET_KEY}
    volumes:
      - ./ca-keys:/app/ca-keys:ro
      - ./vault:/app/vault
      - ./raqim.toml:/app/raqim.toml:ro
      - ./policy.toml:/app/policy.toml:ro
    networks:
      - agent_jail_net
      - egress_wan_net
    ports:
      - "127.0.0.1:8081:8081"

  compromised-agent:
    image: python:3.12-slim
    container_name: compromised-agent
    depends_on:
      - raqim-gateway
    environment:
      # Notice: ZERO real Paystack or OpenAI keys exist in this container!
      - OPENAI_BASE_URL=http://raqim-gateway:8081/v1/egress/openai/v1
      - PAYSTACK_BASE_URL=http://raqim-gateway:8081/v1/egress/paystack
      - RAQIM_WORKLOAD_TOKEN=${RAQIM_WORKLOAD_TOKEN}
    volumes:
      - ./scripts:/app/scripts:ro
    networks:
      - agent_jail_net
    command: ["python3", "/app/scripts/compromised_agent_sim.py"]

networks:
  agent_jail_net:
    driver: bridge
    internal: true
  egress_wan_net:
    driver: bridge