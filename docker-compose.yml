services: 
  raqim-daemon: 
    build: 
      context: .
      dockerfile: Dockerfile.fast
    user: "1000:1000"
    image: raqim/core:v0.1.0
    container_name: raqim-core-daemon
    restart: unless-stopped
    dns: 
      - 8.8.8.8
      - 1.1.1.1
    ports: 
      - "8080:8080"
      - "8081:8081"
      - "7447:7447"
    volumes:
      - ./data:/var/lib/raqim/data
      - ./ca-keys:/var/lib/raqim/ca-keys
      - ./vault:/var/lib/raqim/vault
      - ./aegis.toml:/var/lib/raqim/aegis.toml
      - ./raqim.toml:/var/lib/raqim/raqim.toml
      - ./.fastembed_cache:/var/lib/raqim/.fastembed_cache
    environment: 
    - RUST_LOG=info
    - RAQIM_PORT=8080
    - HOME=/var/lib/raqim
    - FASTEMBED_CACHE_PATH=/var/lib/raqim/data/.cache

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/v1/dashboard/cards || exit 1"] 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    # The Frontend
  raqim-console: 
    build: 
      context: ./raqim-console
      dockerfile: Dockerfile.fast
    image: raqim/console:v0.1.0
    container_name: raqim-console-ui
    restart: unless-stopped
    ports: 
    - "3000:3000"
    environment: 
    - NEXT_PUBLIC_RAQIM_DAEMON_URL=http://localhost:8081
    - RAQIM_INTERNAL_DAEMON_URL=http://raqim-daemon:8081
    depends_on: 
      raqim-daemon: 
        condition: service_healthy